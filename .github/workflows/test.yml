name: Test Suite

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

# Cancel superseded runs on the same ref (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL for the adapter integration tests (tests/postgres-adapter.test.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness-pass
          POSTGRES_DB: harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: 5432
      TEST_PG_DATABASE: harness_test
      TEST_PG_USER: harness
      TEST_PG_PASSWORD: harness-pass

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]    # package.json engines: >=22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check package contents
        run: pnpm pack:check
